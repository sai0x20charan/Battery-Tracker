name: Android Release

on:
  push:
    tags:
      - '*-wear*'
      - '*-mobile*'
      - 'v*'
      - '*-v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore keystore and google services
        run: |
          mkdir -p mobile/src/release

          # Keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > mobile/src/release/batterytracker_release.jks

          # google-services
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > mobile/google-services.json
          cp mobile/google-services.json mobile/src/release/google-services.json 2>/dev/null || true

          # keystore.properties
          echo "storeFile=mobile/src/release/batterytracker_release.jks" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      - name: Determine Targets and Version Info
        run: |
          TAG="${GITHUB_REF_NAME}"
          CLEAN_VERSION="${TAG#v}"

          # Check for beta tag
          if [[ "$CLEAN_VERSION" == *-beta* ]]; then
            IS_BETA=true
            APK_SUFFIX="-beta"
            CLEAN_VERSION="${CLEAN_VERSION/-beta/}"
          else
            IS_BETA=false
            APK_SUFFIX=""
          fi

          # Determine target modules to build
          if [[ "$TAG" == *-wear* ]]; then
            BUILD_MOBILE=false
            BUILD_WEAR=true
            TARGET="wear"
            CLEAN_VERSION="${CLEAN_VERSION/-wear/}"
            RELEASE_TITLE="Battery Tracker Wear OS v${CLEAN_VERSION}"
          elif [[ "$TAG" == *-mobile* ]]; then
            BUILD_MOBILE=true
            BUILD_WEAR=false
            TARGET="mobile"
            CLEAN_VERSION="${CLEAN_VERSION/-mobile/}"
            RELEASE_TITLE="Battery Tracker Mobile v${CLEAN_VERSION}"
          else
            # Default for -v or v* tags (all modules)
            BUILD_MOBILE=true
            BUILD_WEAR=true
            TARGET="all"
            CLEAN_VERSION="${CLEAN_VERSION/-v/}"
            RELEASE_TITLE="Battery Tracker v${CLEAN_VERSION}"
          fi

          if [ "$IS_BETA" = "true" ]; then
            RELEASE_TITLE="${RELEASE_TITLE} (Beta)"
          fi

          # Construct Gradle build tasks dynamically
          GRADLE_TASKS=""
          if [ "$BUILD_MOBILE" = "true" ]; then
            GRADLE_TASKS="$GRADLE_TASKS :mobile:assembleRelease :mobile:bundleRelease"
          fi
          if [ "$BUILD_WEAR" = "true" ]; then
            GRADLE_TASKS="$GRADLE_TASKS :wear:assembleRelease :wear:bundleRelease"
          fi

          echo "IS_BETA=$IS_BETA" >> $GITHUB_ENV
          echo "APK_SUFFIX=$APK_SUFFIX" >> $GITHUB_ENV
          echo "BUILD_MOBILE=$BUILD_MOBILE" >> $GITHUB_ENV
          echo "BUILD_WEAR=$BUILD_WEAR" >> $GITHUB_ENV
          echo "TARGET=$TARGET" >> $GITHUB_ENV
          echo "VERSION_NAME=$CLEAN_VERSION" >> $GITHUB_ENV
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> $GITHUB_ENV
          echo "GRADLE_TASKS=$GRADLE_TASKS" >> $GITHUB_ENV

      - name: Debug Target & Version Info
        run: |
          echo "Tag: ${{ github.ref_name }}"
          echo "Target: $TARGET"
          echo "Build Mobile: $BUILD_MOBILE"
          echo "Build Wear: $BUILD_WEAR"
          echo "Version Name: $VERSION_NAME"
          echo "Is Beta: $IS_BETA"
          echo "APK Suffix: $APK_SUFFIX"
          echo "Gradle Tasks: $GRADLE_TASKS"
          echo "Release Title: $RELEASE_TITLE"

      - name: Create local.properties
        run: |
          touch local.properties
          echo "API_KEY=${{ secrets.API_KEY }}" >> local.properties

      - name: Build Release
        run: ./gradlew $GRADLE_TASKS

      - name: Collect and Rename Release Artifacts
        run: |
          echo "Collecting release artifacts..."
          mkdir -p release-artifacts

          if [ "$BUILD_MOBILE" = "true" ]; then
            for file in mobile/build/outputs/apk/release/*.apk; do
              if [ -f "$file" ]; then
                cp "$file" "release-artifacts/Battery-Tracker-Mobile-${VERSION_NAME}${APK_SUFFIX}.apk"
              fi
            done
            for file in mobile/build/outputs/bundle/release/*.aab; do
              if [ -f "$file" ]; then
                cp "$file" "release-artifacts/Battery-Tracker-Mobile-${VERSION_NAME}.aab"
              fi
            done
          fi

          if [ "$BUILD_WEAR" = "true" ]; then
            for file in wear/build/outputs/apk/release/*.apk; do
              if [ -f "$file" ]; then
                cp "$file" "release-artifacts/Battery-Tracker-Wear-${VERSION_NAME}${APK_SUFFIX}.apk"
              fi
            done
            for file in wear/build/outputs/bundle/release/*.aab; do
              if [ -f "$file" ]; then
                cp "$file" "release-artifacts/Battery-Tracker-Wear-${VERSION_NAME}.aab"
              fi
            done
          fi

          ls -lah release-artifacts/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-builds-${{ env.TARGET }}
          path: release-artifacts/*

      - name: Prepare Release Notes
        run: |
          RELEASE_DATE=$(date +'%Y-%m-%d')
          CHANGELOG_PATH="mobile/src/main/assets/CHANGELOG.md"

          echo "# $RELEASE_TITLE" > release_notes.md
          echo "" >> release_notes.md
          echo "Released: $RELEASE_DATE" >> release_notes.md
          echo "" >> release_notes.md

          if [ -f "$CHANGELOG_PATH" ]; then
            cat "$CHANGELOG_PATH" >> release_notes.md
          else
            echo "No changelog found." >> release_notes.md
          fi

          mkdir -p whatsnew
          if [ -f "$CHANGELOG_PATH" ]; then
            sed 's/^## //' "$CHANGELOG_PATH" | head -c 500 > whatsnew/whatsnew-en-US
          else
            echo "Released on $RELEASE_DATE" > whatsnew/whatsnew-en-US
          fi

      - name: Create GitHub Beta Release
        if: ${{ env.IS_BETA == 'true' }}
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.RELEASE_TITLE }}
          prerelease: true
          body_path: release_notes.md
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: ${{ env.IS_BETA == 'false' }}
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.RELEASE_TITLE }}
          prerelease: false
          body_path: release_notes.md
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f keystore.properties
          rm -f mobile/src/release/batterytracker_release.jks
